# nginx site for auth.handsoffretail.com (single file, no snippet).
# Install:
#   sudo cp infra/nginx/auth.conf /etc/nginx/sites-available/auth.handsoffretail.com
#   sudo ln -s /etc/nginx/sites-available/auth.handsoffretail.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d auth.handsoffretail.com   # adds https (443), certificate and http->https redirect
# limit_req_zone may be defined only once across all nginx files.

# Login rate limit: 10 attempts per minute per IP (burst 5)
limit_req_zone $binary_remote_addr zone=hor_auth_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name auth.handsoffretail.com;

    # Login page (auth-console build)
    root /opt/hor/centralized-auth/hor-auth/web/auth-console/dist;
    index index.html;

    # Backend: login (rate limited)
    location = /api/auth/login {
        limit_req zone=hor_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8091/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Backend: everything else under /api/auth/
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8091/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Frontend routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
