# Include from nginx.conf inside the http {} context.
limit_req_zone $binary_remote_addr zone=hor_auth_login:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name auth.handsoffretail.com;

    root /opt/hor-auth/auth-console/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/auth.handsoffretail.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.handsoffretail.com/privkey.pem;

    include /etc/nginx/snippets/hor-auth-api-locations.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
