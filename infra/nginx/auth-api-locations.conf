# Include inside both auth.handsoffretail.com and apps.handsoffretail.com server blocks.
location = /api/auth/login {
    limit_req zone=hor_auth_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8091/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location /api/auth/ {
    proxy_pass http://127.0.0.1:8091/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
