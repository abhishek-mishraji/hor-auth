spring.application.name=auth-service

# ------------------------------------------------------------------------------------------------
# Every setting below can be changed from .env (in the service's working directory) without
# rebuilding: write   HOR_XXX=value   in .env. The value after ":" in ${HOR_XXX:default} is the
# default used when .env does not set it. Real environment variables of the same name win over .env.
# See .env.example for the full list. The old ~/.hor-stores/secrets.properties is still read as a fallback.
# ------------------------------------------------------------------------------------------------
spring.config.import=optional:file:${user.home}/.hor-stores/secrets.properties,optional:file:.env[.properties]

# --- Database ---
hor.auth.db.host=${HOR_DB_HOST:localhost}
hor.auth.db.port=${HOR_DB_PORT:5432}
hor.auth.db.name=${HOR_AUTH_DB_NAME:auth_db}
hor.auth.db.username=${HOR_DB_USERNAME:auth_svc}
hor.auth.db.password=${HOR_DB_PASSWORD:}
spring.datasource.url=jdbc:postgresql://${hor.auth.db.host}:${hor.auth.db.port}/${hor.auth.db.name}?logServerErrorDetail=false
spring.datasource.username=${hor.auth.db.username}
spring.datasource.password=${hor.auth.db.password}
spring.datasource.hikari.maximum-pool-size=${HOR_DB_POOL_SIZE:10}

# Schema migrations: fixed on purpose (safety: never wipe or skip validation in any environment).
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jackson.default-property-inclusion=non_null

# --- HTTP server ---
# Keep the address 127.0.0.1 in production: nginx is the only public entry point.
server.port=${HOR_SERVER_PORT:8091}
server.address=${HOR_SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.forward-headers-strategy=native

# --- Logging ---
logging.level.root=${HOR_LOG_LEVEL:INFO}
logging.level.com.handsoffretail=${HOR_APP_LOG_LEVEL:INFO}

# --- Tokens, login protection, cookies ---
hor.auth.signing-key-path=${HOR_AUTH_SIGNING_KEY_PATH:${user.home}/.hor-stores/auth-signing-key.pem}
hor.auth.access-token-ttl=${HOR_AUTH_ACCESS_TOKEN_TTL:PT15M}
hor.auth.refresh-token-ttl=${HOR_AUTH_REFRESH_TOKEN_TTL:PT12H}
hor.auth.max-failed-logins=${HOR_AUTH_MAX_FAILED_LOGINS:10}
hor.auth.lock-duration=${HOR_AUTH_LOCK_DURATION:PT15M}
hor.auth.bcrypt-strength=${HOR_AUTH_BCRYPT_STRENGTH:12}
hor.auth.allowed-origins=${HOR_AUTH_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:5181,http://localhost:5182}
hor.auth.client.allowed-origins=${hor.auth.allowed-origins}
hor.auth.cookie-domain=${HOR_AUTH_COOKIE_DOMAIN:}

# --- First start only: first platform admin (used only while there is no admin yet) ---
hor.auth.bootstrap.admin.email=${HOR_AUTH_ADMIN_EMAIL:}
hor.auth.bootstrap.admin.password=${HOR_AUTH_ADMIN_PASSWORD:}
hor.auth.bootstrap.admin.full-name=${HOR_AUTH_ADMIN_FULL_NAME:Platform Administrator}

# --- First start only: default store (created only if it does not exist yet) ---
hor.auth.bootstrap.default-store.store-name=${HOR_STORE_NAME:Tiki Hut}
hor.auth.bootstrap.default-store.store-code=${HOR_STORE_CODE:8730_IN-47872}
hor.auth.bootstrap.default-store.pos-vendor=${HOR_STORE_POS_VENDOR:VERIFONE}
hor.auth.bootstrap.default-store.s3-folder=${HOR_STORE_S3_FOLDER:Tiki_8730_IN-47872/Tiki_8730_IN-47872/}
hor.auth.bootstrap.default-store.address-line1=${HOR_STORE_ADDRESS_LINE1:8730 E US Highway 36}
hor.auth.bootstrap.default-store.city=${HOR_STORE_CITY:Rockville}
hor.auth.bootstrap.default-store.state-code=${HOR_STORE_STATE_CODE:IN}
hor.auth.bootstrap.default-store.postal-code=${HOR_STORE_POSTAL_CODE:47872}
hor.auth.bootstrap.default-store.country-code=${HOR_STORE_COUNTRY_CODE:US}
hor.auth.bootstrap.default-store.timezone=${HOR_STORE_TIMEZONE:America/Indiana/Indianapolis}
